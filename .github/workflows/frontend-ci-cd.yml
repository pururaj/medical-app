name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & lint
  # ─────────────────────────────────────────────
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/medical-app-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/medical-app-ui
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/medical-app-ui
        run: npx ng build --configuration production
        env:
          # Allows the build to proceed even with budget warnings
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/medical-app-ui/dist/medical-app-ui/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Netlify
  # Only runs on push to main
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Post deployment URL
        run: echo "✅ Frontend deployed to Netlify"
