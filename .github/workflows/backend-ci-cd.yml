name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/your-org/medical-app
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/medical-app

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & test all backend services
  # ─────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all services (skip tests for speed on PRs)
        working-directory: backend
        run: |
          mvn -B \
            -pl shared-library,auth-service,api-gateway,patient-service,\
          appointment-service,doctor-service,inventory-service,\
          pharmacy-service,lab-service \
            -am package -DskipTests -q

      # Cache built JARs for the docker job below
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            backend/auth-service/target/*.jar
            backend/api-gateway/target/*.jar
            backend/patient-service/target/*.jar
            backend/appointment-service/target/*.jar
            backend/doctor-service/target/*.jar
            backend/inventory-service/target/*.jar
            backend/pharmacy-service/target/*.jar
            backend/lab-service/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker images & push to GHCR
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────
  dockerize:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: auth-service
            port: 8086
          - name: api-gateway
            port: 8080
          - name: patient-service
            port: 8081
          - name: appointment-service
            port: 8082
          - name: doctor-service
            port: 8083
          - name: inventory-service
            port: 8087
          - name: pharmacy-service
            port: 8088
          - name: lab-service
            port: 8089

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service.name }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service.name }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to DigitalOcean
  # Only runs after all images are pushed
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: dockerize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/.env.example"
          target: "/opt/medical-app"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/medical-app

            # Export the new image tag so compose picks it up
            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_BASE=${{ env.IMAGE_BASE }}

            # Login to GHCR on the server
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose -f deploy/docker-compose.prod.yml pull \
              auth-service api-gateway patient-service appointment-service \
              doctor-service inventory-service pharmacy-service lab-service

            # Rolling restart: keep DBs, MQ, Redis running
            docker compose -f deploy/docker-compose.prod.yml up -d \
              --remove-orphans \
              --no-recreate \
              auth-service api-gateway patient-service appointment-service \
              doctor-service inventory-service pharmacy-service lab-service

            # Force recreate services (picks up new images)
            docker compose -f deploy/docker-compose.prod.yml up -d \
              --force-recreate \
              auth-service api-gateway patient-service appointment-service \
              doctor-service inventory-service pharmacy-service lab-service

            # Prune old images
            docker image prune -f

            echo "✅ Deployment complete — $(date)"
