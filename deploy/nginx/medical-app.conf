# ─────────────────────────────────────────────────────────────────────────────
# Nginx config — Medical App API
# Place at: /etc/nginx/sites-available/medical-app
# Enable: ln -s /etc/nginx/sites-available/medical-app /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS API Server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOURDOMAIN.com;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options               "DENY"              always;
    add_header X-Content-Type-Options        "nosniff"           always;
    add_header X-XSS-Protection              "1; mode=block"     always;
    add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy               "strict-origin"     always;

    # CORS — allow requests from the Netlify frontend
    add_header Access-Control-Allow-Origin   "$http_origin"      always;
    add_header Access-Control-Allow-Methods  "GET,POST,PUT,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Authorization,Content-Type" always;
    add_header Access-Control-Allow-Credentials "true"           always;

    # Handle preflight OPTIONS
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Client upload limit (for bill scan / image uploads)
    client_max_body_size 10M;

    # ── Auth endpoints (stricter rate limiting) ──
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── All API endpoints ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check (no rate limit, no auth)
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Block everything else
    location / {
        return 404;
    }

    # Logging
    access_log /var/log/nginx/medical-app-access.log;
    error_log  /var/log/nginx/medical-app-error.log warn;
}
