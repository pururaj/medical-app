version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Production Docker Compose — Medical App
# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [medical-network]
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-db-defaults: &db-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [medical-network]
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "2"

services:

  # ── Databases ────────────────────────────────────────────────────────────

  patient-db:
    <<: *db-defaults
    container_name: prod-patient-db
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [patient-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  appointment-db:
    <<: *db-defaults
    container_name: prod-appointment-db
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [appointment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-db:
    <<: *db-defaults
    container_name: prod-doctor-db
    environment:
      POSTGRES_DB: doctor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [doctor-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    <<: *db-defaults
    container_name: prod-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [auth-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    <<: *db-defaults
    container_name: prod-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [inventory-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pharmacy-db:
    <<: *db-defaults
    container_name: prod-pharmacy-db
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pharmacy-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab-db:
    <<: *db-defaults
    container_name: prod-lab-db
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [lab-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Message Queue & Cache ─────────────────────────────────────────────────

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.13-alpine
    container_name: prod-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: prod-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend Microservices ─────────────────────────────────────────────────

  auth-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-auth-service:${IMAGE_TAG:-latest}
    container_name: prod-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-gateway:
    <<: *service-defaults
    image: ${IMAGE_BASE}-api-gateway:${IMAGE_TAG:-latest}
    container_name: prod-api-gateway
    ports:
      - "8080:8080"   # Exposed to Nginx on the host
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  patient-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-patient-service:${IMAGE_TAG:-latest}
    container_name: prod-patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patient_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      patient-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  appointment-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-appointment-service:${IMAGE_TAG:-latest}
    container_name: prod-appointment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-db:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      appointment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  doctor-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-doctor-service:${IMAGE_TAG:-latest}
    container_name: prod-doctor-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://doctor-db:5432/doctor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      doctor-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  inventory-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-inventory-service:${IMAGE_TAG:-latest}
    container_name: prod-inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pharmacy-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-pharmacy-service:${IMAGE_TAG:-latest}
    container_name: prod-pharmacy-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pharmacy-db:5432/pharmacy_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      pharmacy-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  lab-service:
    <<: *service-defaults
    image: ${IMAGE_BASE}-lab-service:${IMAGE_TAG:-latest}
    container_name: prod-lab-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://lab-db:5432/lab_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      lab-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  patient-db-data:
  appointment-db-data:
  doctor-db-data:
  auth-db-data:
  inventory-db-data:
  pharmacy-db-data:
  lab-db-data:
  rabbitmq-data:
  redis-data:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  medical-network:
    driver: bridge
