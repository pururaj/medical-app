spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Patient Service Routes
        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/patients/**
          filters:
            - RewritePath=/api/v1/patients/(?<segment>.*), /api/v1/patients/$\{segment}
            - name: CircuitBreaker
              args:
                name: patientServiceCircuitBreaker
                fallbackUri: forward:/fallback/patient-service

        # Appointment Service Routes
        - id: appointment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/appointments/**
          filters:
            - RewritePath=/api/v1/appointments/(?<segment>.*), /api/v1/appointments/$\{segment}

        # Doctor Service Routes
        - id: doctor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/doctors/**
          filters:
            - RewritePath=/api/v1/doctors/(?<segment>.*), /api/v1/doctors/$\{segment}

        # Medical Records Service Routes
        - id: medical-records-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/medical-records/**
          filters:
            - RewritePath=/api/v1/medical-records/(?<segment>.*), /api/v1/medical-records/$\{segment}

        # Billing Service Routes
        - id: billing-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/billing/**
          filters:
            - RewritePath=/api/v1/billing/(?<segment>.*), /api/v1/billing/$\{segment}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Response-Time, ${responseTime}

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:8100"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

server:
  port: 8080

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      patientServiceCircuitBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      patientServiceCircuitBreaker:
        timeout-duration: 3s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
    com.medical.gateway: DEBUG
