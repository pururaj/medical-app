<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/pharmacy"></ion-back-button></ion-buttons>
    <ion-title>Customers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar placeholder="Search by name or phone..." [debounce]="300" (ionInput)="onSearch($event)" animated></ion-searchbar>

  <div *ngIf="loading" class="loading-center"><ion-spinner name="crescent"></ion-spinner></div>

  <ion-list *ngIf="!loading">
    <ion-item-sliding *ngFor="let customer of customers" #slidingItem>
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h2>{{ customer.name }}</h2>
          <p><ion-icon name="phone-portrait-outline"></ion-icon> {{ customer.phone }}</p>
          <p *ngIf="customer.email">{{ customer.email }}</p>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="editCustomer(customer, slidingItem)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="deleteCustomer(customer, slidingItem)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <div *ngIf="customers.length === 0" class="empty-state">
      <ion-icon name="person-outline"></ion-icon>
      <p>No customers found</p>
    </div>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="primary" (click)="addCustomer()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
